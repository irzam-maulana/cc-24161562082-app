
# Contoh error Kubernetes
# NIM: 24161562082

apiVersion: apps/v1
kind: Deployment
metadata:
  name: coba-pull
  namespace: nim-24161562082
spec:
  selector:
    matchLabels:
      app: coba-pull
  template:
    metadata:
      labels:
        app: coba-pull
    spec:
      containers:
        - name: web
          image: cc-nim-app:2.1
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coba-oom
  namespace: nim-24161562082
spec:
  selector:
    matchLabels:
      app: coba-oom
  template:
    metadata:
      labels:
        app: coba-oom
    spec:
      containers:
        - name: web
          image: cc-nim-app:1.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 8Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coba-pending
  namespace: nim-24161562082
spec:
  selector:
    matchLabels:
      app: coba-pending
  template:
    metadata:
      labels:
        app: coba-pending
    spec:
      containers:
        - name: web
          image: cc-nim-app:1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coba-liveness
  namespace: nim-24161562082
spec:
  selector:
    matchLabels:
      app: coba-liveness
  template:
    metadata:
      labels:
        app: coba-liveness
    spec:
      containers:
        - name: web
          image: cc-nim-app:1.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /sehat
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
